<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f3a8a"/>
    </marker>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8efff"/>
      <stop offset="100%" stop-color="#c7d6ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="380" fill="#ffffff"/>

  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    Digital Parking Permit System — Workflow
  </text>

  <!-- Step 1 -->
  <rect x="40"  y="120" width="180" height="90" rx="14" ry="14" fill="url(#g)" stroke="#1f3a8a" stroke-width="2"/>
  <text x="130" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Vehicle</text>
  <text x="130" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Registration</text>

  <!-- Step 2 -->
  <rect x="260" y="120" width="180" height="90" rx="14" ry="14" fill="url(#g)" stroke="#1f3a8a" stroke-width="2"/>
  <text x="350" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Permit</text>
  <text x="350" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Request</text>

  <!-- Step 3 -->
  <rect x="480" y="120" width="180" height="90" rx="14" ry="14" fill="url(#g)" stroke="#1f3a8a" stroke-width="2"/>
  <text x="570" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Zone</text>
  <text x="570" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Check</text>

  <!-- Step 4 -->
  <rect x="700" y="120" width="180" height="90" rx="14" ry="14" fill="url(#g)" stroke="#1f3a8a" stroke-width="2"/>
  <text x="790" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Permit</text>
  <text x="790" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Approval</text>

  <!-- Step 5 -->
  <rect x="900" y="120" width="180" height="90" rx="14" ry="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="990" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Parking</text>
  <text x="990" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Verification</text>
  <text x="990" y="195" text-anchor="middle" font-size="11" fill="#166534">(Security)</text>

  <!-- Arrows -->
  <line x1="220" y1="165" x2="258" y2="165" stroke="#1f3a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="165" x2="478" y2="165" stroke="#1f3a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="165" x2="698" y2="165" stroke="#1f3a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="165" x2="898" y2="165" stroke="#1f3a8a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="550" y="295" text-anchor="middle" font-size="13" fill="#334155">
    Actors: Students / Staff (steps 1–2) · System (steps 3–4) · Security Officer (step 5)
  </text>
  <text x="550" y="320" text-anchor="middle" font-size="12" fill="#64748b">
    Drawn for SER216 final project · diagrams.net
  </text>
</svg>
